<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climb Mount Everest - Real Mountain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; overflow: hidden; }

    #menu {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    #menu h1 { color: #fff; font-size: 42px; margin-bottom: 20px; text-align: center; padding: 0 10px; }
    #menu .input-group {
      display: flex; flex-direction: column; gap: 12px;
      background: rgba(255,255,255,0.13); border-radius: 10px; padding: 22px;
      width: min(92vw, 540px); backdrop-filter: blur(8px);
    }
    #menu label { color: #fff; font-weight: 700; }
    #musicUrl { padding: 12px; border: none; border-radius: 8px; font-size: 15px; }
    #startBtn {
      padding: 13px 16px; border: none; border-radius: 8px;
      font-size: 18px; font-weight: 700; color: #fff; background: #4CAF50; cursor: pointer;
    }

    #gameContainer { position: relative; width: 100vw; height: 100vh; display: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #ui, #inventory {
      position: absolute; top: 10px; z-index: 100; color: #fff;
      background: rgba(0,0,0,0.55); border-radius: 8px; padding: 12px;
      font-size: 13px;
    }
    #ui { left: 10px; min-width: 290px; }
    #inventory { right: 10px; min-width: 190px; }

    .bar-wrap {
      width: 220px; height: 14px; background: #333;
      border: 2px solid #fff; border-radius: 6px; overflow: hidden;
      margin-top: 4px; margin-bottom: 6px;
    }
    .bar { height: 100%; width: 100%; }

    #temperatureBar { background: linear-gradient(90deg, #2f80ff, #39d76d, #ffe259, #ff4b4b); }
    #oxygenBar { background: linear-gradient(90deg, #7bd3ff, #4cb8ff, #2d9dff); }

    .active-heat-items { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .heat-item-timer {
      font-size: 11px; padding: 4px 7px; border-radius: 6px;
      background: rgba(255,100,100,0.45); border: 1px solid rgba(255,150,150,0.9);
    }

    #storeMenu, #itemMenu {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(92vw, 560px); max-height: 80vh; overflow-y: auto;
      background: rgba(0,0,0,0.92); color: #fff; border-radius: 12px;
      padding: 22px; z-index: 500; display: none;
    }
    .store-item, .item-option {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin: 10px 0; padding: 12px;
      background: rgba(255,255,255,0.08); border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    }
    .item-info { flex: 1; }
    .item-name { font-weight: 700; margin-bottom: 4px; }
    .item-details { font-size: 12px; color: #cfcfcf; }
    .item-btn {
      border: none; border-radius: 6px; cursor: pointer;
      padding: 7px 10px; font-size: 12px; font-weight: 700;
      background: #4CAF50; color: #fff;
    }
    .close-btn {
      position: absolute; right: 10px; top: 10px;
      border: none; border-radius: 6px; padding: 8px 10px;
      background: #f44336; color: #fff; font-weight: 700; cursor: pointer;
    }

    #controlButtons {
      position: fixed; left: 16px; bottom: 16px; z-index: 200;
      display: flex; flex-direction: column; gap: 8px;
    }
    .control-btn {
      border: 2px solid #fff; border-radius: 10px; cursor: pointer;
      padding: 12px 16px; font-size: 14px; font-weight: 700; color: #fff;
      background: rgba(80,130,255,0.78); touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>🏔️ Climb Mount Everest</h1>
    <div class="input-group">
      <label for="musicUrl">Enter Music URL (optional):</label>
      <input type="text" id="musicUrl" placeholder="https://example.com/music.mp3">
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div>Height: <span id="heightValue">0</span> m</div>
      <div>Zone: <span id="zoneValue">Base</span></div>
      <div>Money: $<span id="money">100</span></div>

      <div>Temperature: <span id="tempValue">122</span>°F</div>
      <div class="bar-wrap"><div id="temperatureBar" class="bar"></div></div>

      <div>Oxygen: <span id="oxygenValue">100</span>%</div>
      <div class="bar-wrap"><div id="oxygenBar" class="bar"></div></div>

      <div>Tool: <span id="toolDisplay">Axe</span></div>
      <div>Near shop? <span id="nearShopHint">No</span> (Press ⬇)</div>
      <div>Camp reached: <span id="campHint">No</span></div>
      <div id="controllerStatus">Controller: Not connected</div>
      <div class="active-heat-items" id="activeHeatItems"></div>
    </div>

    <div id="inventory">
      <h3>Inventory</h3>
      <div>Wood: <span id="woodCount">0</span></div>
      <div>Stone: <span id="stoneCount">0</span></div>
      <div>Hot Pocket: <span id="hotPocketCount">0</span></div>
      <div>Heat Lamp: <span id="heatLampCount">0</span></div>
      <div>Thermal Blanket: <span id="thermalBlanketCount">0</span></div>
    </div>

    <div id="storeMenu">
      <button class="close-btn" onclick="closeStore()">✕</button>
      <h2>🛍️ Shop</h2>
      <div id="storeItems"></div>
    </div>

    <div id="itemMenu">
      <button class="close-btn" onclick="closeItemMenu()">✕</button>
      <h2>🔥 Heat Items</h2>
      <div id="itemOptions"></div>
    </div>

    <div id="controlButtons">
      <button class="control-btn" id="leftBtn">⬅️ LEFT</button>
      <button class="control-btn" id="rightBtn">➡️ RIGHT</button>
      <button class="control-btn" id="jumpBtn">⬆️ JUMP</button>
      <button class="control-btn" id="downBtn">⬇️ SHOP</button>
      <button class="control-btn" id="mineBtn">⛏️ MINE/CHOP</button>
      <button class="control-btn" id="useBtn">🔥 USE ITEM</button>
      <button class="control-btn" id="toolBtn">🔨 TOOL (1/2)</button>
    </div>
  </div>

  <script>
    // ============== Core ==============
    const WORLD_WIDTH = 10000;
    const WORLD_HEIGHT = 7900;

    const GRAVITY = 0.56;
    const PLAYER_SPEED = 5;
    const JUMP_POWER = -12;

    const FREEZE_SECONDS = 240;
    const BASE_TEMP_DECAY_PER_SEC = (122 - 32) / FREEZE_SECONDS;

    const OXYGEN_START_ALT = 3000;
    const OXYGEN_DRAIN_MAX = 8; // % per sec at extreme altitude
    const OXYGEN_RECOVER = 10;  // % per sec at lower altitude

    const gameState = {
      menu: true,
      storeOpen: false,
      itemMenuOpen: false,
      gameOver: false,
      music: null,
      musicUrl: '',
      won: false,
    };

    const player = {
      x: 260,
      y: 0,
      width: 30,
      height: 50,
      vx: 0,
      vy: 0,
      targetVx: 0,
      isJumping: true,
      temperature: 122,
      maxTemperature: 212,
      oxygen: 100,
      currentTool: 'axe',
    };

    const inventory = {
      wood: 0, stone: 0,
      hotPocket: 0, heatLamp: 0, thermalBlanket: 0,
      money: 100,
    };

    const heatItems = {
      hotPocket: { duration: 30, name: 'Hot Pocket', price: 50 },
      heatLamp: { duration: 60, name: 'Heat Lamp', price: 100 },
      thermalBlanket: { duration: 90, name: 'Thermal Blanket', price: 150 },
    };

    let activeHeatItems = [];
    let keys = {};
    let touchControls = { left: false, right: false, jump: false };
    let actionDown = false;
    let lastTime = performance.now();
    let started = false;

    const terrainPoints = [];
    const trees = [];
    const rocks = [];
    const shops = [];
    const camps = [];
    const avalanches = [];

    const checkpoint = { x: 260, y: 0, reached: false };
    let lastAvalancheSpawn = 0;

    const camera = { x: 0, y: 0 };
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ============== Helpers ==============
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function getHeightMeters() {
      return Math.max(0, Math.floor((WORLD_HEIGHT - player.y) * 0.82 - 120));
    }

    function zoneNameByAlt(alt) {
      if (alt < 1300) return 'Forest Line';
      if (alt < 3000) return 'Snow Slope';
      if (alt < 4800) return 'Ice Wall';
      if (alt < 6400) return 'Storm Ridge';
      return 'Death Zone';
    }

    function setControllerStatus(msg) {
      document.getElementById('controllerStatus').textContent = `Controller: ${msg}`;
    }

    // ============== Gamepad (Switch friendly) ==============
    const gamepadState = {
      index: null, connected: false, name: '', prev: [],
      left: false, right: false,
      jumpPressed: false, downPressed: false, minePressed: false, usePressed: false, toolPressed: false,
    };
    const DEADZONE = 0.25;

    function isSwitchLike(id='') {
      const s = id.toLowerCase();
      return s.includes('switch') || s.includes('nintendo') || s.includes('pro controller') || s.includes('joy-con');
    }
    function btn(gp, i) { return !!(gp.buttons[i] && gp.buttons[i].pressed); }
    function just(gp, i) {
      const c = btn(gp, i);
      const p = !!gamepadState.prev[i];
      gamepadState.prev[i] = c;
      return c && !p;
    }

    window.addEventListener('gamepadconnected', (e) => {
      gamepadState.index = e.gamepad.index;
      gamepadState.connected = true;
      gamepadState.name = e.gamepad.id || 'Unknown';
      gamepadState.prev = new Array(e.gamepad.buttons.length).fill(false);
      setControllerStatus(`Connected (${gamepadState.name})`);
    });
    window.addEventListener('gamepaddisconnected', (e) => {
      if (gamepadState.index === e.gamepad.index) {
        gamepadState.index = null; gamepadState.connected = false; gamepadState.name = '';
        gamepadState.prev = []; setControllerStatus('Not connected');
      }
    });

    function pollGamepad() {
      gamepadState.left = gamepadState.right = false;
      gamepadState.jumpPressed = gamepadState.downPressed = false;
      gamepadState.minePressed = gamepadState.usePressed = gamepadState.toolPressed = false;

      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      let gp = null;
      if (gamepadState.index != null && pads[gamepadState.index]) gp = pads[gamepadState.index];
      if (!gp) gp = Array.from(pads).find(Boolean);
      if (!gp) return;

      if (!gamepadState.connected || gamepadState.index !== gp.index) {
        gamepadState.connected = true;
        gamepadState.index = gp.index;
        gamepadState.name = gp.id || 'Unknown';
        gamepadState.prev = new Array(gp.buttons.length).fill(false);
        setControllerStatus(`Connected (${gamepadState.name})`);
      }

      const ax = gp.axes[0] || 0;
      gamepadState.left = ax < -DEADZONE || btn(gp,14);
      gamepadState.right = ax > DEADZONE || btn(gp,15);

      const sw = isSwitchLike(gp.id);
      const jumpButtons = sw ? [0,1] : [0];
      const mineButtons = [2];
      const toolButtons = [3];
      const downButtons = [13];
      const useButtons = [9];

      for (const i of jumpButtons) if (just(gp, i)) { gamepadState.jumpPressed = true; break; }
      for (const i of mineButtons) if (just(gp, i)) { gamepadState.minePressed = true; break; }
      for (const i of toolButtons) if (just(gp, i)) { gamepadState.toolPressed = true; break; }
      for (const i of downButtons) if (just(gp, i)) { gamepadState.downPressed = true; break; }
      for (const i of useButtons) if (just(gp, i)) { gamepadState.usePressed = true; break; }
    }

    // ============== Resize ==============
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // ============== Terrain ==============
    function getTerrainY(worldX) {
      const x = clamp(worldX, 0, WORLD_WIDTH);
      const step = 40;
      const idx = Math.floor(x / step);
      const p1 = terrainPoints[idx] || terrainPoints[terrainPoints.length - 1];
      const p2 = terrainPoints[idx + 1] || p1;
      const t = (x - p1.x) / Math.max(1, (p2.x - p1.x));
      return p1.y + (p2.y - p1.y) * t;
    }

    function localSlope(worldX) {
      const y1 = getTerrainY(worldX - 30);
      const y2 = getTerrainY(worldX + 30);
      return (y2 - y1) / 60; // rise/run
    }

    function generateWorld() {
      terrainPoints.length = 0; trees.length = 0; rocks.length = 0; shops.length = 0; camps.length = 0; avalanches.length = 0;

      const step = 40;
      const baseY = WORLD_HEIGHT - 140;
      const peakTargetY = 780;

      let x = 0;
      while (x <= WORLD_WIDTH) {
        const t = x / WORLD_WIDTH;

        const broadRise = Math.pow(t, 1.08);
        const upperCone = Math.pow(Math.max(0, (t - 0.62) / 0.38), 1.8);

        const ridge1 = Math.sin(t * Math.PI * 3.4) * 90;
        const ridge2 = Math.sin(t * Math.PI * 11.0 + 0.9) * 28;
        const ridge3 = Math.sin(t * Math.PI * 24.0 + 1.7) * 10;

        const ledge = (Math.abs(Math.sin(t * Math.PI * 7.0)) < 0.17) ? 25 : 0;
        const mountainLift = (baseY - peakTargetY) * (0.78 * broadRise + 0.22 * upperCone);

        let y = baseY - mountainLift + ridge1 + ridge2 + ridge3 + ledge;
        y = clamp(y, 680, WORLD_HEIGHT - 80);

        terrainPoints.push({ x, y });
        x += step;
      }

      for (let i = 8; i < terrainPoints.length - 8; i++) {
        const p = terrainPoints[i];
        const pPrev = terrainPoints[i - 1];
        const pNext = terrainPoints[i + 1];
        const steepness = Math.abs(pNext.y - pPrev.y);
        const altitude = WORLD_HEIGHT - p.y;

        if (altitude < 2600 && steepness < 18 && Math.random() > 0.72) {
          trees.push({
            x: p.x + (Math.random() - 0.5) * 16,
            yBottom: p.y,
            width: 32 + Math.random() * 6,
            height: 56 + Math.random() * 22,
            chopped: false,
          });
        }

        const rockChance = altitude > 2400 ? 0.34 : 0.22;
        if (Math.random() < rockChance) {
          rocks.push({
            x: p.x + (Math.random() - 0.5) * 14,
            yBottom: p.y,
            width: 30 + Math.random() * 18,
            height: 20 + Math.random() * 16,
            mined: false,
          });
        }

        if (i % 26 === 0 && steepness < 14) {
          shops.push({ x: p.x - 30, yBottom: p.y, width: 60, height: 60 });
        }

        if (i % 45 === 0 && steepness < 12) {
          camps.push({ x: p.x - 26, yBottom: p.y, width: 52, height: 36, reached: false });
        }
      }

      player.x = 260;
      player.y = getTerrainY(player.x) - player.height;
      player.vy = 0;
      player.isJumping = false;

      checkpoint.x = player.x;
      checkpoint.y = player.y;
      checkpoint.reached = true;
    }

    // ============== Entities logic ==============
    function isNearShop() {
      const px = player.x + player.width * 0.5;
      const py = player.y + player.height * 0.5;
      for (const s of shops) {
        const sx = s.x + s.width * 0.5;
        const sy = s.yBottom - s.height * 0.5;
        if (Math.hypot(px - sx, py - sy) < 120) return true;
      }
      return false;
    }

    function tryOpenShop() { if (isNearShop()) openStore(); }

    function tryMineOrChop() {
      const range = 82;
      const px = player.x + player.width * 0.5;
      const py = player.y + player.height * 0.5;

      if (player.currentTool === 'axe') {
        for (const t of trees) {
          if (t.chopped) continue;
          const tx = t.x + t.width * 0.5;
          const ty = t.yBottom - t.height * 0.5;
          if (Math.hypot(px - tx, py - ty) < range) {
            t.chopped = true;
            inventory.wood++;
            updateUI();
            return;
          }
        }
      }

      if (player.currentTool === 'pickaxe') {
        for (const r of rocks) {
          if (r.mined) continue;
          const rx = r.x + r.width * 0.5;
          const ry = r.yBottom - r.height * 0.5;
          if (Math.hypot(px - rx, py - ry) < range) {
            r.mined = true;
            inventory.stone++;
            updateUI();
            return;
          }
        }
      }
    }

    function checkCampReached() {
      const px = player.x + player.width * 0.5;
      const py = player.y + player.height;
      let reachedAny = false;

      for (const c of camps) {
        const cx = c.x + c.width * 0.5;
        const cy = c.yBottom;
        if (Math.hypot(px - cx, py - cy) < 70) {
          c.reached = true;
          reachedAny = true;
          if ((WORLD_HEIGHT - c.yBottom) > (WORLD_HEIGHT - checkpoint.y)) {
            checkpoint.x = c.x + c.width * 0.5;
            checkpoint.y = c.yBottom - player.height;
          }
        }
      }
      return reachedAny;
    }

    function spawnAvalanche(dt, nowSec) {
      const alt = getHeightMeters();
      if (alt < 4200) return;

      const minInterval = 8 - Math.min(4, (alt - 4200) / 1200); // gets more frequent
      if (nowSec - lastAvalancheSpawn < minInterval) return;

      if (Math.random() < 0.018 * dt * 60) {
        const aheadX = clamp(player.x + 300 + Math.random() * 600, 0, WORLD_WIDTH);
        const y = getTerrainY(aheadX) - 90;
        avalanches.push({
          x: aheadX,
          y,
          radius: 20 + Math.random() * 12,
          vx: -3.5 - Math.random() * 2.2,
          life: 9,
        });
        lastAvalancheSpawn = nowSec;
      }
    }

    function updateAvalanches(dt) {
      for (let i = avalanches.length - 1; i >= 0; i--) {
        const a = avalanches[i];
        a.x += a.vx * (dt * 60);
        a.y = getTerrainY(a.x) - 90;
        a.life -= dt;

        const px = player.x + player.width * 0.5;
        const py = player.y + player.height * 0.5;
        if (Math.hypot(px - a.x, py - a.y) < a.radius + 14) {
          // hit: lose temperature + oxygen and knockback
          player.temperature = Math.max(32, player.temperature - 18);
          player.oxygen = Math.max(0, player.oxygen - 20);
          player.vx -= 4;
          a.life = 0;
        }

        if (a.life <= 0 || a.x < -200) avalanches.splice(i, 1);
      }
    }

    function terrainCollisionAndSlip(dt) {
      const leftFootX = player.x + 4;
      const rightFootX = player.x + player.width - 4;
      const feetY = player.y + player.height;

      const groundL = getTerrainY(leftFootX);
      const groundR = getTerrainY(rightFootX);
      const groundY = Math.min(groundL, groundR);

      if (feetY >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.isJumping = false;

        // ice slip at high altitude
        const alt = getHeightMeters();
        if (alt > 3400) {
          const slope = localSlope(player.x);
          const slip = slope * (alt > 5200 ? 1.7 : 1.1); // stronger in death zone
          player.vx += slip * (dt * 60) * 0.35;
        }
      } else {
        player.isJumping = true;
      }
    }

    function respawnAtCheckpoint() {
      player.x = checkpoint.x;
      player.y = checkpoint.y;
      player.vx = 0;
      player.vy = 0;
      player.isJumping = false;
      player.temperature = 110;
      player.oxygen = 85;
    }

    // ============== UI / menus ==============
    function openStore() {
      if (gameState.storeOpen) return;
      gameState.storeOpen = true;

      const storeItems = document.getElementById('storeItems');
      const storeMenu = document.getElementById('storeMenu');
      storeItems.innerHTML = '';

      const buyItems = [
        { id: 'hotPocket', name: 'Hot Pocket', price: 50 },
        { id: 'heatLamp', name: 'Heat Lamp', price: 100 },
        { id: 'thermalBlanket', name: 'Thermal Blanket', price: 150 },
      ];

      for (const item of buyItems) {
        const d = document.createElement('div');
        d.className = 'store-item';
        d.innerHTML = `
          <div class="item-info">
            <div class="item-name">🔥 ${item.name}</div>
            <div class="item-details">Price: $${item.price}</div>
          </div>
          <button class="item-btn" onclick="buyItem('${item.id}', ${item.price})">Buy</button>
        `;
        storeItems.appendChild(d);
      }

      storeItems.innerHTML += `<hr style="margin:12px 0;border-color:#555;">`;

      const sell = [
        { id: 'wood', name: 'Wood', price: 20 },
        { id: 'stone', name: 'Stone', price: 30 },
      ];

      for (const item of sell) {
        const d = document.createElement('div');
        d.className = 'store-item';
        d.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-details">Sell for: $${item.price} | Have: ${inventory[item.id]}</div>
          </div>
          <button class="item-btn" onclick="sellItem('${item.id}', ${item.price})">Sell</button>
        `;
        storeItems.appendChild(d);
      }

      storeMenu.style.display = 'block';
    }
    function closeStore() { gameState.storeOpen = false; document.getElementById('storeMenu').style.display = 'none'; }

    function openItemMenu() {
      gameState.itemMenuOpen = true;
      const itemOptions = document.getElementById('itemOptions');
      itemOptions.innerHTML = '';

      for (const key of Object.keys(heatItems)) {
        if (inventory[key] <= 0) continue;
        const item = heatItems[key];
        const d = document.createElement('div');
        d.className = 'item-option';
        d.innerHTML = `
          <div class="item-info">
            <div class="item-name">🔥 ${item.name}</div>
            <div class="item-details">Duration: ${item.duration}s | Have: ${inventory[key]}</div>
          </div>
          <button class="item-btn" onclick="useItem('${key}')">Use</button>
        `;
        itemOptions.appendChild(d);
      }

      if (!itemOptions.children.length) itemOptions.innerHTML = `<p style="color:#aaa">No heat items available</p>`;
      document.getElementById('itemMenu').style.display = 'block';
    }
    function closeItemMenu() { gameState.itemMenuOpen = false; document.getElementById('itemMenu').style.display = 'none'; }

    function buyItem(id, price) {
      if (inventory.money < price) return alert('Not enough money!');
      inventory.money -= price;
      inventory[id]++;
      updateUI();
      openStore();
    }
    function sellItem(id, price) {
      if (inventory[id] <= 0) return;
      inventory[id]--;
      inventory.money += price;
      updateUI();
      openStore();
    }
    function useItem(key) {
      if (inventory[key] <= 0) return;
      inventory[key]--;
      const item = heatItems[key];
      activeHeatItems.push({ type: key, duration: item.duration, start: performance.now()/1000 });
      player.temperature = Math.min(player.maxTemperature, player.temperature + 40);
      updateUI();
      closeItemMenu();
    }

    function setTool(tool) {
      player.currentTool = tool;
      document.getElementById('toolBtn').textContent = tool === 'axe' ? '🔨 TOOL (1/2)' : '⛏️ TOOL (2/2)';
      updateUI();
    }

    function updateUI() {
      const h = getHeightMeters();
      document.getElementById('heightValue').textContent = h;
      document.getElementById('zoneValue').textContent = zoneNameByAlt(h);

      document.getElementById('money').textContent = inventory.money;
      document.getElementById('tempValue').textContent = Math.floor(player.temperature);
      document.getElementById('oxygenValue').textContent = Math.floor(player.oxygen);

      document.getElementById('woodCount').textContent = inventory.wood;
      document.getElementById('stoneCount').textContent = inventory.stone;
      document.getElementById('hotPocketCount').textContent = inventory.hotPocket;
      document.getElementById('heatLampCount').textContent = inventory.heatLamp;
      document.getElementById('thermalBlanketCount').textContent = inventory.thermalBlanket;

      document.getElementById('toolDisplay').textContent = player.currentTool === 'axe' ? 'Axe' : 'Pickaxe';
      document.getElementById('nearShopHint').textContent = isNearShop() ? 'YES' : 'No';

      const campReached = camps.some(c => c.reached);
      document.getElementById('campHint').textContent = campReached ? 'Yes' : 'No';

      document.getElementById('temperatureBar').style.width = clamp(((player.temperature - 32) / 180) * 100, 0, 100) + '%';
      document.getElementById('oxygenBar').style.width = clamp(player.oxygen, 0, 100) + '%';

      const now = performance.now()/1000;
      const activeDiv = document.getElementById('activeHeatItems');
      activeDiv.innerHTML = '';
      for (const it of activeHeatItems) {
        const rem = Math.ceil(it.duration - (now - it.start));
        if (rem > 0) {
          const d = document.createElement('div');
          d.className = 'heat-item-timer';
          d.textContent = `${heatItems[it.type].name}: ${rem}s`;
          activeDiv.appendChild(d);
        }
      }
    }

    // ============== Input ==============
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === '1') setTool('axe');
      if (e.key === '2') setTool('pickaxe');
      if (e.key === 'e' || e.key === 'E') openItemMenu();
      if (e.key === 'Escape') {
        if (gameState.storeOpen) closeStore();
        if (gameState.itemMenuOpen) closeItemMenu();
      }
    });
    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      if (e.key === 'ArrowDown') actionDown = false;
    });

    function bindHoldButton(id, key) {
      const el = document.getElementById(id);
      const on = (e)=>{ e.preventDefault(); touchControls[key]=true; };
      const off = (e)=>{ e.preventDefault(); touchControls[key]=false; };
      el.addEventListener('touchstart', on, {passive:false});
      el.addEventListener('touchend', off, {passive:false});
      el.addEventListener('touchcancel', off, {passive:false});
      el.addEventListener('mousedown', on);
      el.addEventListener('mouseup', off);
      el.addEventListener('mouseleave', off);
    }
    bindHoldButton('leftBtn', 'left');
    bindHoldButton('rightBtn', 'right');
    bindHoldButton('jumpBtn', 'jump');

    document.getElementById('downBtn').addEventListener('click', tryOpenShop);
    document.getElementById('mineBtn').addEventListener('click', tryMineOrChop);
    document.getElementById('useBtn').addEventListener('click', openItemMenu);
    document.getElementById('toolBtn').addEventListener('click', () => setTool(player.currentTool === 'axe' ? 'pickaxe' : 'axe'));

    canvas.addEventListener('click', () => {
      if (!gameState.storeOpen && !gameState.itemMenuOpen) tryMineOrChop();
    });

    // ============== Drawing ==============
    function drawTerrain() {
      const altitude = getHeightMeters();
      const coldFactor = clamp((altitude - 1200) / 3800, 0, 1);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, `rgba(${Math.floor(150 - 40 * coldFactor)}, ${Math.floor(195 - 30 * coldFactor)}, ${Math.floor(235 - 10 * coldFactor)}, 1)`);
      sky.addColorStop(1, `rgba(${Math.floor(220 - 30 * coldFactor)}, ${Math.floor(238 - 20 * coldFactor)}, 255, 1)`);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // far parallax peaks
      ctx.save();
      ctx.globalAlpha = 0.26;
      ctx.fillStyle = '#9fb5c8';
      const par = camera.x * 0.22;
      for (let i = -2; i < 10; i++) {
        const bx = i * 260 - (par % 260);
        ctx.beginPath();
        ctx.moveTo(bx, canvas.height);
        ctx.lineTo(bx + 130, canvas.height - 220 - (i % 2) * 45);
        ctx.lineTo(bx + 260, canvas.height);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // mountain
      ctx.beginPath();
      const first = terrainPoints[0];
      ctx.moveTo(first.x - camera.x, canvas.height + 200);
      for (const p of terrainPoints) ctx.lineTo(p.x - camera.x, p.y - camera.y);
      const last = terrainPoints[terrainPoints.length - 1];
      ctx.lineTo(last.x - camera.x, canvas.height + 200);
      ctx.closePath();

      const mGrad = ctx.createLinearGradient(0, -camera.y, 0, WORLD_HEIGHT - camera.y);
      mGrad.addColorStop(0.00, '#f6fbff');
      mGrad.addColorStop(0.20, '#edf5fc');
      mGrad.addColorStop(0.42, '#d4e0ea');
      mGrad.addColorStop(0.72, '#9ba8b3');
      mGrad.addColorStop(1.00, '#6f7d88');
      ctx.fillStyle = mGrad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(first.x - camera.x, first.y - camera.y);
      for (const p of terrainPoints) ctx.lineTo(p.x - camera.x, p.y - camera.y);
      ctx.strokeStyle = '#d9e5ef';
      ctx.lineWidth = 2;
      ctx.stroke();

      // summit snow overlay
      ctx.save();
      ctx.beginPath();
      let started = false;
      for (const p of terrainPoints) {
        const worldAlt = WORLD_HEIGHT - p.y;
        if (worldAlt > 3000) {
          const sx = p.x - camera.x;
          const sy = p.y - camera.y;
          if (!started) { ctx.moveTo(sx, sy); started = true; }
          else ctx.lineTo(sx, sy);
        }
      }
      if (started) {
        ctx.lineTo(WORLD_WIDTH - camera.x, -camera.y);
        ctx.lineTo(0 - camera.x, -camera.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTrees() {
      for (const t of trees) {
        if (t.chopped) continue;
        const sx = t.x - camera.x;
        const sy = t.yBottom - t.height - camera.y;
        if (sx < -100 || sx > canvas.width + 100) continue;

        ctx.fillStyle = '#8b4513';
        ctx.fillRect(sx + t.width * 0.38, sy + t.height * 0.45, t.width * 0.24, t.height * 0.55);
        ctx.fillStyle = '#2e8b57';
        ctx.beginPath();
        ctx.arc(sx + t.width * 0.5, sy + t.height * 0.35, t.width * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRocks() {
      for (const r of rocks) {
        if (r.mined) continue;
        const sx = r.x - camera.x;
        const sy = r.yBottom - r.height - camera.y;
        if (sx < -100 || sx > canvas.width + 100) continue;

        ctx.fillStyle = '#7f8a93';
        ctx.beginPath();
        ctx.ellipse(sx + r.width * 0.5, sy + r.height * 0.6, r.width * 0.5, r.height * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5f6a74';
        ctx.fillRect(sx + r.width * 0.25, sy + r.height * 0.45, r.width * 0.4, r.height * 0.25);
      }
    }

    function drawShopsAndCamps() {
      for (const s of shops) {
        const sx = s.x - camera.x;
        const sy = s.yBottom - s.height - camera.y;
        if (sx < -120 || sx > canvas.width + 120) continue;

        ctx.fillStyle = '#8b4513';
        ctx.fillRect(sx, sy, s.width, s.height);
        ctx.fillStyle = '#d2691e';
        ctx.fillRect(sx + 4, sy + 4, s.width - 8, s.height - 8);

        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🛍️', sx + s.width * 0.5, sy + 38);
      }

      for (const c of camps) {
        const sx = c.x - camera.x;
        const sy = c.yBottom - c.height - camera.y;
        if (sx < -120 || sx > canvas.width + 120) continue;

        ctx.fillStyle = c.reached ? '#4caf50' : '#795548';
        ctx.fillRect(sx, sy, c.width, c.height);
        ctx.fillStyle = '#e0c28c';
        ctx.beginPath();
        ctx.moveTo(sx - 5, sy);
        ctx.lineTo(sx + c.width + 5, sy);
        ctx.lineTo(sx + c.width / 2, sy - 20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('⛺', sx + c.width * 0.5, sy + 24);
      }
    }

    function drawAvalanches() {
      for (const a of avalanches) {
        const sx = a.x - camera.x;
        const sy = a.y - camera.y;
        ctx.beginPath();
        ctx.arc(sx, sy, a.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(240,248,255,0.9)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx + a.radius * 0.25, sy - a.radius * 0.2, a.radius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220,235,248,0.85)';
        ctx.fill();
      }
    }

    function drawPlayer() {
      const sx = player.x - camera.x;
      const sy = player.y - camera.y;

      let color = '#ffff00';
      if (player.temperature < 50) color = '#0066ff';
      else if (player.temperature > 180) color = '#ff3300';

      ctx.fillStyle = color;
      ctx.fillRect(sx + 10, sy + 5, 10, 10);
      ctx.fillRect(sx + 10, sy + 15, 10, 15);
      ctx.fillRect(sx + 5, sy + 18, 20, 5);
      ctx.fillRect(sx + 10, sy + 30, 5, 15);
      ctx.fillRect(sx + 15, sy + 30, 5, 15);
    }

    function drawWeatherOverlays(dt) {
      const alt = getHeightMeters();
      const windStrength = clamp((alt - 2200) / 3500, 0, 1);

      // wind streaks
      if (windStrength > 0) {
        ctx.save();
        ctx.globalAlpha = 0.08 + windStrength * 0.12;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        for (let i = 0; i < 28; i++) {
          const y = (i * 29 + performance.now() * 0.04) % (canvas.height + 40) - 20;
          const x = (i * 67 + performance.now() * 0.12) % (canvas.width + 120) - 60;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 40 + windStrength * 70, y + 3);
          ctx.stroke();
        }
        ctx.restore();
      }

      // fog / blizzard veil in high alt
      if (alt > 4200) {
        const fogAlpha = clamp((alt - 4200) / 2200, 0.08, 0.28);
        const fog = ctx.createLinearGradient(0,0,0,canvas.height * 0.5);
        fog.addColorStop(0, `rgba(255,255,255,${fogAlpha})`);
        fog.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = fog;
        ctx.fillRect(0,0,canvas.width,canvas.height * 0.6);
      }
    }

    // ============== Update/Render loop ==============
    function update(dt, nowSec) {
      pollGamepad();

      if (gamepadState.toolPressed) setTool(player.currentTool === 'axe' ? 'pickaxe' : 'axe');
      if (gamepadState.usePressed) {
        if (gameState.itemMenuOpen) closeItemMenu();
        else openItemMenu();
      }
      if (gamepadState.minePressed && !gameState.storeOpen && !gameState.itemMenuOpen) tryMineOrChop();
      if (gamepadState.downPressed && !gameState.storeOpen && !gameState.itemMenuOpen) tryOpenShop();

      if (!gameState.storeOpen && !gameState.itemMenuOpen) {
        if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchControls.left || gamepadState.left) player.targetVx = -PLAYER_SPEED;
        if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchControls.right || gamepadState.right) player.targetVx = PLAYER_SPEED;

        const jumpPressed = (keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' '] || touchControls.jump || gamepadState.jumpPressed);
        if (jumpPressed && !player.isJumping) {
          player.vy = JUMP_POWER;
          player.isJumping = true;
          touchControls.jump = false;
        }

        const downPressed = !!keys['ArrowDown'];
        if (downPressed && !actionDown) tryOpenShop();
        actionDown = downPressed;

        if (keys['f'] || keys['F']) tryMineOrChop();
      }

      player.vx += (player.targetVx - player.vx) * Math.min(1, dt * 10);
      player.targetVx = 0;
      player.vy += GRAVITY * (dt * 60);

      player.x += player.vx * (dt * 60);
      player.y += player.vy * (dt * 60);

      player.x = clamp(player.x, 0, WORLD_WIDTH - player.width);
      player.y = clamp(player.y, 0, WORLD_HEIGHT - player.height);

      terrainCollisionAndSlip(dt);

      // temperature
      player.temperature -= BASE_TEMP_DECAY_PER_SEC * dt;

      const now = nowSec;
      activeHeatItems = activeHeatItems.filter(it => {
        const elapsed = now - it.start;
        if (elapsed < it.duration) {
          player.temperature += 0.15 * (dt * 60);
          return true;
        }
        return false;
      });

      // oxygen by altitude
      const alt = getHeightMeters();
      if (alt > OXYGEN_START_ALT) {
        const t = clamp((alt - OXYGEN_START_ALT) / 3800, 0, 1);
        player.oxygen -= (1 + t * (OXYGEN_DRAIN_MAX - 1)) * dt;
      } else {
        player.oxygen += OXYGEN_RECOVER * dt;
      }
      player.oxygen = clamp(player.oxygen, 0, 100);

      // oxygen hurts temp when very low
      if (player.oxygen < 18) {
        player.temperature -= (18 - player.oxygen) * 0.02 * (dt * 60);
      }

      player.temperature = clamp(player.temperature, 32, player.maxTemperature);

      checkCampReached();
      spawnAvalanche(dt, nowSec);
      updateAvalanches(dt);

      // win near summit
      if (!gameState.won && player.x > WORLD_WIDTH - 240) {
        gameState.won = true;
        alert('🏁 You reached the summit! Congratulations!');
      }

      // fail conditions
      if (!gameState.gameOver && (player.temperature <= 32 || player.oxygen <= 0)) {
        gameState.gameOver = true;
        alert('You collapsed! Respawning at last camp...');
        respawnAtCheckpoint();
        gameState.gameOver = false;
      }

      // camera
      const targetCamX = player.x - canvas.width * 0.45;
      const targetCamY = player.y - canvas.height * 0.55;
      camera.x += (targetCamX - camera.x) * Math.min(1, dt * 6);
      camera.y += (targetCamY - camera.y) * Math.min(1, dt * 6);
      camera.x = clamp(camera.x, 0, WORLD_WIDTH - canvas.width);
      camera.y = clamp(camera.y, 0, WORLD_HEIGHT - canvas.height);

      updateUI();
    }

    function render(dt) {
      drawTerrain();
      drawTrees();
      drawRocks();
      drawShopsAndCamps();
      drawAvalanches();
      drawPlayer();
      drawWeatherOverlays(dt);
    }

    function loop(nowMs) {
      const dt = Math.min(0.05, (nowMs - lastTime) / 1000 || 0.016);
      lastTime = nowMs;
      const nowSec = nowMs / 1000;

      update(dt, nowSec);
      render(dt);

      requestAnimationFrame(loop);
    }

    // ============== Boot ==============
    function bindHoldButton(id, key) {
      const el = document.getElementById(id);
      const on = (e)=>{ e.preventDefault(); touchControls[key] = true; };
      const off = (e)=>{ e.preventDefault(); touchControls[key] = false; };
      el.addEventListener('touchstart', on, { passive: false });
      el.addEventListener('touchend', off, { passive: false });
      el.addEventListener('touchcancel', off, { passive: false });
      el.addEventListener('mousedown', on);
      el.addEventListener('mouseup', off);
      el.addEventListener('mouseleave', off);
    }

    bindHoldButton('leftBtn', 'left');
    bindHoldButton('rightBtn', 'right');
    bindHoldButton('jumpBtn', 'jump');

    document.getElementById('downBtn').addEventListener('click', tryOpenShop);
    document.getElementById('mineBtn').addEventListener('click', tryMineOrChop);
    document.getElementById('useBtn').addEventListener('click', openItemMenu);
    document.getElementById('toolBtn').addEventListener('click', () => setTool(player.currentTool === 'axe' ? 'pickaxe' : 'axe'));

    canvas.addEventListener('click', () => {
      if (!gameState.storeOpen && !gameState.itemMenuOpen) tryMineOrChop();
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      if (started) return;
      started = true;

      const musicUrl = document.getElementById('musicUrl').value.trim();
      gameState.musicUrl = musicUrl;
      if (musicUrl) {
        gameState.music = new Audio(musicUrl);
        gameState.music.loop = true;
        gameState.music.volume = 0.3;
        gameState.music.play().catch(()=>{});
      }

      document.getElementById('menu').style.display = 'none';
      document.getElementById('gameContainer').style.display = 'block';
      gameState.menu = false;

      resizeCanvas();
      generateWorld();
      updateUI();
      requestAnimationFrame(loop);
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // expose inline handlers
    window.closeStore = closeStore;
    window.closeItemMenu = closeItemMenu;
    window.buyItem = buyItem;
    window.sellItem = sellItem;
    window.useItem = useItem;
  </script>
